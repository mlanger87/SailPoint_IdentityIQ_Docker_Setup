# ===========================================================================
# PostgreSQL tuning for SailPoint IdentityIQ 8.5 (development)
# ---------------------------------------------------------------------------
# Appended to the entrypoint-generated postgresql.conf by
# 00-apply-tuning.sh.
#
# Values are sized for a local dev instance (Docker Desktop, ~16 GB engine
# RAM), NOT for production.
# ===========================================================================

# ---------------------------------------------------------------------------
# Connections
# ---------------------------------------------------------------------------
# IIQ opens up to 50 connections per DataSource (dataSource.maxTotal=50).
# With three DataSources (main, plugins, accessHistory) plus console/DB UI
# the default of 100 is not reliably enough.
max_connections = 200

# ---------------------------------------------------------------------------
# Memory
# ---------------------------------------------------------------------------
shared_buffers = 512MB
effective_cache_size = 2GB
work_mem = 16MB
maintenance_work_mem = 256MB

# ---------------------------------------------------------------------------
# WAL / checkpoints
# ---------------------------------------------------------------------------
wal_buffers = 16MB
min_wal_size = 128MB
max_wal_size = 2GB
checkpoint_completion_target = 0.9

# ---------------------------------------------------------------------------
# Planner
# ---------------------------------------------------------------------------
# SSD assumption: random access costs barely more than sequential.
random_page_cost = 1.1
effective_io_concurrency = 200

# ---------------------------------------------------------------------------
# Logging (development: generous)
# ---------------------------------------------------------------------------
log_min_duration_statement = 2000
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'

# ---------------------------------------------------------------------------
# Note on max_prepared_transactions
# ---------------------------------------------------------------------------
# IdentityIQ uses NO distributed XA transactions in standard operation.
# The parameter therefore stays at its default 0. Only if an XA
# DataSource setup is added must a value > 0 be set here.
