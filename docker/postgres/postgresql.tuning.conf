# ===========================================================================
# PostgreSQL-Tuning fuer SailPoint IdentityIQ 8.5 (Entwicklungsumgebung)
# ---------------------------------------------------------------------------
# Wird ueber include_dir=/etc/postgresql/conf.d geladen und ergaenzt die
# vom Entrypoint erzeugte postgresql.conf.
#
# Die Werte sind auf eine lokale Dev-Instanz ausgelegt (Docker Desktop,
# ~16 GB Engine-RAM), NICHT auf Produktion.
# ===========================================================================

# ---------------------------------------------------------------------------
# Verbindungen
# ---------------------------------------------------------------------------
# IIQ oeffnet pro DataSource bis zu 50 Verbindungen (dataSource.maxTotal=50).
# Bei drei DataSources (main, plugins, accessHistory) plus Konsole/pgAdmin
# reicht der Default von 100 nicht zuverlaessig.
max_connections = 200

# ---------------------------------------------------------------------------
# Speicher
# ---------------------------------------------------------------------------
shared_buffers = 512MB
effective_cache_size = 2GB
work_mem = 16MB
maintenance_work_mem = 256MB

# ---------------------------------------------------------------------------
# WAL / Checkpoints
# ---------------------------------------------------------------------------
wal_buffers = 16MB
min_wal_size = 128MB
max_wal_size = 2GB
checkpoint_completion_target = 0.9

# ---------------------------------------------------------------------------
# Planer
# ---------------------------------------------------------------------------
# SSD-Annahme: wahlfreier Zugriff kostet kaum mehr als sequenzieller.
random_page_cost = 1.1
effective_io_concurrency = 200

# ---------------------------------------------------------------------------
# Logging (Entwicklung: grosszuegig)
# ---------------------------------------------------------------------------
log_min_duration_statement = 2000
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'

# ---------------------------------------------------------------------------
# Hinweis zu max_prepared_transactions
# ---------------------------------------------------------------------------
# IdentityIQ nutzt im Standardbetrieb KEINE verteilten XA-Transaktionen.
# Der Parameter bleibt daher auf dem Default 0. Nur falls ein
# XA-DataSource-Setup ergaenzt wird, muss hier ein Wert > 0 gesetzt werden.
