# ===========================================================================
# SailPoint IdentityIQ 8.5 - local development environment
# ---------------------------------------------------------------------------
# Start:   docker compose up -d
# Status:  docker compose ps
# Logs:    docker compose logs -f iiq
# Reset:   docker compose down -v
#
# No "version:" key - deprecated in the Compose spec, current versions
# emit a warning.
# ===========================================================================

name: iiq85

services:

  # -------------------------------------------------------------------------
  # PostgreSQL 17
  #
  # Schema is created on the very first start from SailPoint's shipped DDL
  # (see docker/postgres/Dockerfile).
  # POSTGRES_DB is deliberately NOT set - the DDL creates all three
  # databases itself.
  # -------------------------------------------------------------------------
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
      args:
        IIQ_VERSION: ${IIQ_VERSION:-8.5}
        IIQ_DB_USER: ${IIQ_DB_USER:-identityiq}
        IIQ_DB_PASSWORD: ${IIQ_DB_PASSWORD:-identityiq}
        IIQ_PLUGIN_DB_USER: ${IIQ_PLUGIN_DB_USER:-identityiqPlugin}
        IIQ_PLUGIN_DB_PASSWORD: ${IIQ_PLUGIN_DB_PASSWORD:-identityiqPlugin}
        IIQ_AH_DB_USER: ${IIQ_AH_DB_USER:-identityiqah}
        IIQ_AH_DB_PASSWORD: ${IIQ_AH_DB_PASSWORD:-identityiqah}
    image: iiq-postgres:${IIQ_VERSION:-8.5}
    container_name: iiq-postgres
    # Cheap hardening, safe everywhere: no setuid escalation inside
    # the container.
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Speeds up initdb; harmless for a dev database.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      # Bound to 127.0.0.1, not to all interfaces.
      #
      # Docker publishes unprefixed ports on 0.0.0.0 - the database would
      # be reachable from the whole network (customer LAN, hotel Wi-Fi).
      # With the prefix it stays reachable from this machine only.
      #
      # Applies to every service here; this environment is for local
      # development only.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume instead of bind mount: on Windows this is far faster
      # than an NTFS mount via gRPC-FUSE.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d identityiq"]
      interval: 10s
      timeout: 5s
      retries: 30
      # The schema DDL is 9,146 lines and creates 250+ tables.
      start_period: 120s
    restart: unless-stopped
    networks: [iiq-net]

  # -------------------------------------------------------------------------
  # Init container
  #
  # Runs once and exits. Only then does the actual IIQ service start
  # (depends_on: service_completed_successfully). The import is
  # idempotent - a re-run detects from the database state that
  # initialization already happened.
  # -------------------------------------------------------------------------
  iiq-init:
    build: &iiq-build
      context: .
      dockerfile: docker/iiq/Dockerfile
      args:
        IIQ_VERSION: ${IIQ_VERSION:-8.5}
        IIQ_PATCH: ${IIQ_PATCH:-}
        DB_HOST: postgres
        DB_PORT: "5432"
        IIQ_DB_USER: ${IIQ_DB_USER:-identityiq}
        IIQ_DB_PASSWORD: ${IIQ_DB_PASSWORD:-identityiq}
        IIQ_PLUGIN_DB_USER: ${IIQ_PLUGIN_DB_USER:-identityiqPlugin}
        IIQ_PLUGIN_DB_PASSWORD: ${IIQ_PLUGIN_DB_PASSWORD:-identityiqPlugin}
        IIQ_AH_DB_USER: ${IIQ_AH_DB_USER:-identityiqah}
        IIQ_AH_DB_PASSWORD: ${IIQ_AH_DB_PASSWORD:-identityiqah}
    image: iiq-app:${IIQ_VERSION:-8.5}
    container_name: iiq-init
    # Cheap hardening, safe everywhere: no setuid escalation inside
    # the container.
    security_opt: ["no-new-privileges:true"]
    # Own image, uid 1000, binds >1024, needs no capability at all.
    cap_drop: [ALL]
    environment:
      INIT: "y"
      DB_HOST: postgres
      DB_PORT: "5432"
    volumes:
      - ./data/objects:/data/objects:ro
      - ./data/plugins:/data/plugins:ro
      - ./data/certs:/data/certs:ro
      # Authoritative HR source for the DelimitedFile connector.
      # Deliberately writable so the file can be extended from inside
      # the container. This path is what the Application's "file"
      # attribute points to.
      - ./data/hr:/data/hr
    depends_on:
      postgres:
        condition: service_healthy
    # No Tomcat runs in the init container - the HTTP healthcheck
    # inherited from the image would mark it permanently "unhealthy".
    healthcheck:
      disable: true
    restart: "no"
    networks: [iiq-net]

  # -------------------------------------------------------------------------
  # IdentityIQ on Tomcat 9 / OpenJDK 21
  # -------------------------------------------------------------------------
  iiq:
    build: *iiq-build
    image: iiq-app:${IIQ_VERSION:-8.5}
    container_name: iiq
    # Cheap hardening, safe everywhere: no setuid escalation inside
    # the container.
    security_opt: ["no-new-privileges:true"]
    # Own image, uid 1000, binds >1024, needs no capability at all.
    cap_drop: [ALL]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      # These flags MUST live here: the launcher WEB-INF/bin/iiq sets
      # them itself from Java 17 on, but Tomcat inherits nothing from it.
      # --add-exports is mandatory for JDK 17+ per Installation Guide
      # (p.6); without --add-opens, parts of Hibernate/Spring fail under
      # Java 21's stricter module encapsulation.
      # NOTE: a YAML folded block (>-) has NO comments - a # line inside
      # becomes part of the value and is passed to the JVM as an
      # argument. Explanations belong here, above the block.
      #
      # Not set: com.sun.jndi.ldap.connect.pool.protocol. Its value would
      # be "plain ssl" - with a space, which cannot be passed inside a
      # folded block. Unquoted, "ssl" becomes a separate argument (Java:
      # "Could not find or load main class ssl"); quoted, the quotes end
      # up as literals in the value. Either way Tomcat fails to start.
      #
      # The option only controls pooling for LDAPS connections and is
      # dispensable in a dev environment. If needed, set it via
      # JAVA_TOOL_OPTIONS in the environment block.
      CATALINA_OPTS: >-
        -Xms1g
        -Xmx${IIQ_HEAP:-4g}
        -XX:+UseG1GC
        -Djava.awt.headless=true
        -Diiq.hostname=${IIQ_NODE:-iiq-dev}
        --add-opens=java.base/java.lang=ALL-UNNAMED
        --add-opens=java.base/java.lang.invoke=ALL-UNNAMED
        --add-opens=java.base/java.util=ALL-UNNAMED
        --add-exports=java.naming/com.sun.jndi.ldap=ALL-UNNAMED
        -Dcom.sun.jndi.ldap.connect.pool.timeout=3000
        ${IIQ_EXTRA_OPTS:-}
    ports:
      - "127.0.0.1:${IIQ_HTTP_PORT:-8080}:8080"
    volumes:
      - ./data/objects:/data/objects:ro
      - ./data/plugins:/data/plugins:ro
      - ./data/certs:/data/certs:ro
      # Authoritative HR source for the DelimitedFile connector.
      # Deliberately writable so the file can be extended from inside
      # the container. This path is what the Application's "file"
      # attribute points to.
      - ./data/hr:/data/hr
    depends_on:
      postgres:
        condition: service_healthy
      iiq-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [iiq-net]

  # -------------------------------------------------------------------------
  # Mailpit - catches every mail IIQ sends
  #
  # SMTP runs container-internal only on 1025; only the web UI is
  # published. No conflict with port 25 on the Windows host.
  # -------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.21
    # Explicit platform: this image's manifest lists linux/386 BEFORE
    # linux/amd64. With the containerd image store Docker otherwise picks
    # the 386 variant, whose 32-bit binaries fail in the container with
    # "exec /mailpit: exec format error".
    platform: linux/amd64
    container_name: iiq-mailpit
    # Cheap hardening, safe everywhere: no setuid escalation inside
    # the container.
    security_opt: ["no-new-privileges:true"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [iiq-net]

  # -------------------------------------------------------------------------
  # OpenLDAP - test directory for aggregation and provisioning
  #
  # Image choice: there is no official OpenLDAP image.
  #   - osixia/openldap (used in three of the four reference projects)
  #     has been unmaintained for years; last release 1.5.0.
  #   - bitnami/openldap moved to bitnamilegacy in 2025 and receives no
  #     further updates there, but is current in content
  #     (OpenLDAP 2.6.10 on Debian 12).
  #
  # For a local test directory the frozen state is acceptable - the
  # service is not exposed externally. For production-like setups, a
  # self-built image or a real directory would be preferable.
  # -------------------------------------------------------------------------
  openldap:
    image: bitnamilegacy/openldap:2.6.10-debian-12-r4
    container_name: iiq-openldap
    # Cheap hardening, safe everywhere: no setuid escalation inside
    # the container.
    security_opt: ["no-new-privileges:true"]
    environment:
      LDAP_ROOT: ${LDAP_ROOT:-dc=example,dc=com}
      LDAP_ADMIN_USERNAME: ${LDAP_ADMIN_USER:-admin}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-adminpassword}
      LDAP_SKIP_DEFAULT_TREE: "yes"
      LDAP_CUSTOM_LDIF_DIR: /ldifs
      # Loads the ppolicy module and overlay so that pwdAccountLockedTime
      # exists; that is the attribute the IIQ LDAP connector sets on
      # Disable (revokeAttr in 22-Application-LDAP.xml). Without it the
      # leaver's disable fails with "attribute type undefined".
      # Config is written on first init: change needs a fresh ldapdata volume.
      LDAP_CONFIGURE_PPOLICY: "yes"
    ports:
      - "127.0.0.1:${LDAP_PORT:-1389}:1389"
    volumes:
      - ./docker/openldap/ldif:/ldifs:ro
      - ldapdata:/bitnami/openldap
    # On first start the image additionally loads the LDIFs. Without this
    # healthcheck the container counts as ready while the directory is
    # still empty - ldap-ui shows an empty tree and an aggregation would
    # run against nothing.
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:1389 -b '${LDAP_ROOT:-dc=example,dc=com}' -s base >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks: [iiq-net]

  # -------------------------------------------------------------------------
  # Mock REST API - fourth target system, for the Web Services connector
  #
  # Emulates an ordinary HR-management API: nested responses
  # (data[]/meta{}), offset paging, bearer token, its own error format.
  # Deliberately NOT SCIM - that is what the "scim" service is for.
  #
  # These quirks are exactly what integrations hinge on in real projects:
  # rootPath must point to data, paging must be mapped to offset/limit.
  # A flat list would not exercise that.
  #
  # Seed accounts come from the same HR CSV as the other target systems,
  # so employeeId is the same correlation key everywhere.
  # -------------------------------------------------------------------------
  mockapi:
    build:
      context: .
      dockerfile: docker/mockapi/Dockerfile
    image: iiq-mockapi:${IIQ_VERSION:-8.5}
    container_name: iiq-mockapi
    # Cheap hardening, safe everywhere: no setuid escalation inside
    # the container.
    security_opt: ["no-new-privileges:true"]
    # Own image, uid 1000, binds >1024, needs no capability at all.
    cap_drop: [ALL]
    environment:
      API_TOKEN: ${MOCKAPI_TOKEN:-mocktoken}
      # Basic Auth as alternative - the connector supports both.
      BASIC_USER: ${MOCKAPI_USER:-iiq}
      BASIC_PASSWORD: ${MOCKAPI_PASSWORD:-iiqpassword}
      SEED_COUNT: "4"
    ports:
      - "127.0.0.1:${MOCKAPI_PORT:-8200}:8000"
    volumes:
      - ./data/hr:/data/hr:ro
    restart: unless-stopped
    networks: [iiq-net]

  # -------------------------------------------------------------------------
  # SCIM server - third target system
  #
  # Tool choice:
  #   - harrykodden/scim: Python implementation of RFC 7643/7644, amd64
  #     first in the manifest. Tested: serves ServiceProviderConfig,
  #     supports patch and filter, and accepts created users with
  #     id/meta/etag - usable as a real target system, not read-only.
  #   - i2scim (Quarkus) and Apache SCIMple would be alternatives; the
  #     former is heavier, the latter was unreachable.
  #
  # Data lives in the container (flat-file backend). Sufficient for dev;
  # a container restart resets it, which is more useful than harmful
  # when testing.
  #
  # Auth via bearer token (API_KEY), matching the SCIM 2.0 connector's
  # authType.
  # -------------------------------------------------------------------------
  scim:
    # Pinned to the digest: the image has no version tags, and "latest"
    # would change silently on an upstream push - every other image here
    # is pinned as well.
    image: harrykodden/scim@sha256:e75540ee0ddd4908c572bd9149331d077d472b3cd91f1773806f2b38fd788a10
    platform: linux/amd64
    container_name: iiq-scim
    # Cheap hardening, safe everywhere: no setuid escalation inside
    # the container.
    security_opt: ["no-new-privileges:true"]
    environment:
      API_KEY: ${SCIM_API_KEY:-secret}
      LOGLEVEL: INFO
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ServiceProviderConfig', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    ports:
      - "127.0.0.1:${SCIM_PORT:-8100}:8000"
    restart: unless-stopped
    networks: [iiq-net]

  # -------------------------------------------------------------------------
  # LDAP UI - browser for the test directory
  #
  # Tool choice:
  #   - phpLDAPadmin (in three of the four reference projects) is dated
  #     visually and technically; the osixia image has been unmaintained
  #     for years.
  #   - LLDAP is not a browser but a standalone LDAP server with a web
  #     UI - it would replace OpenLDAP rather than complement it.
  #   - dnknth/ldap-ui: lean Vue UI on Alpine, shows the real directory
  #     tree, can create/modify/delete entries, supports LDAP search
  #     filters and a schema view.
  #
  # Log in with the directory's admin DN:
  #     cn=admin,dc=example,dc=com  /  adminpassword
  # -------------------------------------------------------------------------
  ldap-ui:
    # Pinned by digest: personal namespace with a mutable tag. Was 0.15.4.
    image: dnknth/ldap-ui@sha256:186d758f7698892c6ef2642af6ed0f134fa611ed371e4d804e4816b700888059
    platform: linux/amd64
    container_name: iiq-ldap-ui
    # Cheap hardening, safe everywhere: no setuid escalation inside
    # the container.
    security_opt: ["no-new-privileges:true"]
    environment:
      LDAP_URL: ldap://openldap:1389
      BASE_DN: ${LDAP_ROOT:-dc=example,dc=com}
      # Binds the login name to the admin DN. Without it the full DN
      # would have to be typed every time.
      BIND_PATTERN: cn=%s,${LDAP_ROOT:-dc=example,dc=com}
      LOGIN_ATTR: cn
      # Passwords are hashed with SSHA on create/modify.
      PASSWD_HASH: SSHA
    ports:
      - "127.0.0.1:${LDAP_UI_PORT:-5080}:5000"
    depends_on:
      openldap:
        condition: service_healthy
    restart: unless-stopped
    networks: [iiq-net]

  # -------------------------------------------------------------------------
  # DBGate - database UI
  #
  # Tool choice:
  #   - pgAdmin was ruled out: on this host its image resolves to the
  #     arm64 variant ("exec format error"), even with a forced platform
  #     and across several tags.
  #   - Adminer worked flawlessly but looks very dated.
  #   - DBGate: modern UI, SQL editor with autocomplete, table editor,
  #     data export. Connections are preconfigured via CONNECTIONS, so
  #     nothing has to be created manually.
  #
  # The databases are listed individually on purpose so all three show
  # up in the sidebar.
  # -------------------------------------------------------------------------
  dbgate:
    image: dbgate/dbgate:7.3.0
    platform: linux/amd64
    container_name: iiq-dbgate
    # Cheap hardening, safe everywhere: no setuid escalation inside
    # the container.
    security_opt: ["no-new-privileges:true"]
    environment:
      CONNECTIONS: iiq,plugin,ah,target

      LABEL_iiq: IdentityIQ
      SERVER_iiq: postgres
      PORT_iiq: "5432"
      USER_iiq: ${IIQ_DB_USER:-identityiq}
      PASSWORD_iiq: ${IIQ_DB_PASSWORD:-identityiq}
      DATABASE_iiq: identityiq
      ENGINE_iiq: postgres@dbgate-plugin-postgres

      LABEL_plugin: IdentityIQ Plugins
      SERVER_plugin: postgres
      PORT_plugin: "5432"
      USER_plugin: ${IIQ_PLUGIN_DB_USER:-identityiqPlugin}
      PASSWORD_plugin: ${IIQ_PLUGIN_DB_PASSWORD:-identityiqPlugin}
      DATABASE_plugin: identityiqPlugin
      ENGINE_plugin: postgres@dbgate-plugin-postgres

      LABEL_ah: IdentityIQ Access History
      SERVER_ah: postgres
      PORT_ah: "5432"
      USER_ah: ${IIQ_AH_DB_USER:-identityiqah}
      PASSWORD_ah: ${IIQ_AH_DB_PASSWORD:-identityiqah}
      DATABASE_ah: identityiqah
      ENGINE_ah: postgres@dbgate-plugin-postgres

      # Target database of the JDBC connector. Shows what IIQ actually
      # writes when provisioning - tables IIQData and IIQAccountRoles
      # in schema targetapp.
      LABEL_target: JDBC Target System
      SERVER_target: postgres
      PORT_target: "5432"
      USER_target: targetapp
      PASSWORD_target: targetapp
      DATABASE_target: targetdb
      ENGINE_target: postgres@dbgate-plugin-postgres
    ports:
      - "127.0.0.1:${DBGATE_PORT:-5050}:3000"
    volumes:
      - dbgatedata:/root/.dbgate
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [iiq-net]

networks:
  iiq-net:
    driver: bridge

volumes:
  pgdata:
  ldapdata:
  dbgatedata:

