# ===========================================================================
# Development overrides
# ---------------------------------------------------------------------------
# "docker compose" reads this file AUTOMATICALLY in addition to the base.
# It holds settings you do not want in production:
#
#   - Java debugger port (JDWP) for remote debugging from the IDE
#   - log directory as bind mount, so logs open directly in the editor
#
# NOT here: IIQ debug pages. -Dsailpoint.debugPages=true comes from
# IIQ_EXTRA_OPTS in .env and is appended by the BASE compose file, so it
# is on even without this override. Remove it from .env to turn it off.
#
# JDWP binds 0.0.0.0:8000 inside the container (it must - docker-proxy
# connects from the bridge gateway) and is published on 127.0.0.1 only.
# Consequence: every sibling container on iiq-net could attach a
# debugger to the IIQ JVM. Accepted for a laptop dev stack; drop this
# file (-f docker-compose.yml) when that is not acceptable.
#
# To start without these overrides:
#     docker compose -f docker-compose.yml up -d
# ===========================================================================

services:

  iiq:
    environment:
      # Evaluated by the Tomcat launcher and passed through to the JVM.
      # suspend=n: Tomcat does NOT wait for the debugger and starts
      # normally without an attached IDE.
      JPDA_ADDRESS: "0.0.0.0:8000"
      JPDA_TRANSPORT: "dt_socket"
      # CATALINA_OPTS is deliberately NOT repeated here.
      #
      # Compose replaces an environment key entirely instead of merging
      # it. A copy here would silently go stale on every change to the
      # base - which is exactly what happened:
      # -Dcom.sun.jndi.ldap.connect.pool.protocol was missing in normal
      # operation because the override overwrote the base.
      #
      # Instead the base appends ${IIQ_EXTRA_OPTS}. The value lives in
      # .env (IIQ_EXTRA_OPTS) - Compose expands ${...} only from there,
      # not from another service's environment block.
    ports:
      - "127.0.0.1:${IIQ_DEBUG_PORT:-8000}:8000"
    # "jpda run" enables the debug agent.
    command: ["catalina.sh", "jpda", "run"]
    volumes:
      - ./data/objects:/data/objects:ro
      - ./data/plugins:/data/plugins:ro
      - ./data/certs:/data/certs:ro
      - ./data/logs:/usr/local/tomcat/logs
